# Revisa cada push y pull request a main antes de que Vercel publique:
# el contrato (formato, clippy y pruebas) y que la app compile.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contrato:
    name: Contrato (cargo test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: Formato
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Pruebas
        run: cargo test

  app:
    name: App (npm run build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 trae npm 11, la versión con la que se generó package-lock.json.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
